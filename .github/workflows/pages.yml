name: Update market dashboard and publish Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sectors.html'
      - 'jp-sectors.html'
      - 'scripts/update_sectors.py'
      - 'scripts/update_jp_sectors.py'
      - 'scripts/update_data.py'
      - 'jp-sectors.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 2-6'  # US close: JST 10:17 Tue-Sat
    - cron: '17 8 * * 1-5'  # Japan close: JST 17:17 Mon-Fri
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch & validate market data
        env:
          ALLOW_TSE_THIRD_PARTY_DATA: ${{ vars.ALLOW_TSE_THIRD_PARTY_DATA }}
        run: python scripts/update_data.py
      - name: Fetch 11 sector ETFs
        run: python scripts/update_sectors.py
      - name: Fetch 17 Japanese sector ETFs
        continue-on-error: true  # One failed external data feed must not take down existing pages.
        run: python scripts/update_jp_sectors.py
      - name: Stage Pages site
        run: |
          mkdir -p site
          cp index.html data.json sectors.html sectors.json jp-sectors.html jp-sectors.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
