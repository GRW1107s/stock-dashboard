
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&P500・NASDAQ総合 日次騰落率</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f8fafc;
    color: #1e293b;
    font-family: Arial, "Noto Sans JP", sans-serif;
  }
  main {
    max-width: 900px;
    margin: 32px auto;
    padding: 0 15px;
  }
  h1 { font-size: 25px; margin-bottom: 8px; }
  .subtitle { color: #64748b; font-size: 13px; }
  .controls { display: flex; gap: 8px; margin: 24px 0 12px; flex-wrap: wrap; }
  button {
    border: 1px solid #cbd5e1;
    background: white;
    border-radius: 7px;
    padding: 9px 15px;
    cursor: pointer;
  }
  button.active { background: #1e293b; color: white; }
  .table-box {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    background: #f1f5f9;
    color: #475569;
    padding: 14px 5px;
    font-size: 13px;
  }
  td {
    border-top: 1px solid #e2e8f0;
    padding: 12px 5px;
    text-align: center;
    font-size: 13px;
  }
  tbody tr:nth-child(even) { background: #fafbfc; }
  .pct {
    display: inline-block;
    padding: 6px;
    min-width: 76px;
    border-radius: 6px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .up { color: #15803d; background: #dcfce7; }
  .down { color: #dc2626; background: #fee2e2; }
  .flat { color: #475569; background: #e2e8f0; }
  .date { color: #475569; font-variant-numeric: tabular-nums; }
  .info { font-size: 12px; color: #64748b; margin-top: 15px; }
  @media (max-width: 450px) {
    h1 { font-size: 20px; }
    th, td { font-size: 11px; }
    .pct { min-width: 65px; font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <h1>米国市場 日次騰落率</h1>
  <p class="subtitle">S&P500・NASDAQ総合｜前営業日比</p>

  <div class="controls">
    <button class="active" onclick="showRows(30,this)">直近30日</button>
    <button onclick="showRows(90,this)">直近90日</button>
    <button onclick="showRows(0,this)">すべて</button>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>S&P500</th>
          <th>NASDAQ総合</th>
        </tr>
      </thead>
      <tbody id="data-body">
        <tr><td colspan="3">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <p id="count" class="info"></p>
  <p id="updated" class="info"></p>
  <p class="info">米国市場の終値ベース。データ提供元：Yahoo Finance（非公式API）</p>
</main>

<script>
let allData = [];

function formatPercent(value) {
  if (typeof value !== "number" || !Number.isFinite(value)) {
    return '<span class="pct flat">—</span>';
  }
  const cls = value > 0 ? "up" : value < 0 ? "down" : "flat";
  const sign = value > 0 ? "+" : "";
  return `<span class="pct ${cls}">${sign}${value.toFixed(2)}%</span>`;
}

function showRows(limit, button) {
  if (button) {
    document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
  }
  const rows = limit === 0 ? allData : allData.slice(0, limit);
  document.getElementById("data-body").innerHTML = rows.map(r => `
    <tr>
      <td class="date">${r.date.replace(/-/g, "/")}</td>
      <td>${formatPercent(r.sp500)}</td>
      <td>${formatPercent(r.nasdaq)}</td>
    </tr>
  `).join("");
  document.getElementById("count").textContent =
    `${rows.length}件表示 / 全${allData.length}件`;
}

fetch("./data.json?t=" + Date.now(), {cache: "no-store"})
  .then(response => {
    if (!response.ok) throw new Error("データ取得失敗");
    return response.json();
  })
  .then(data => {
    if (!Array.isArray(data.rows)) throw new Error("データ形式が不正です");
    allData = data.rows
      .filter(r =>
        /^\d{4}-\d{2}-\d{2}$/.test(r.date) &&
        typeof r.sp500 === "number" && Number.isFinite(r.sp500) &&
        typeof r.nasdaq === "number" && Number.isFinite(r.nasdaq)
      )
      .sort((a,b) => b.date.localeCompare(a.date));
    showRows(30);
    if (data.updated_at) {
      document.getElementById("updated").textContent =
        "最終更新：" + new Date(data.updated_at).toLocaleString("ja-JP",
        {timeZone:"Asia/Tokyo"});
    }
  })
  .catch(error => {
    document.getElementById("data-body").innerHTML =
      `<tr><td colspan="3">データを読み込めませんでした。GitHub Actionsを確認してください。</td></tr>`;
    console.error(error);
  });
</script>
</body>
</html>
